output_dir: /Users/zhou/Documents/PycharmProject/my-kb/raw/ai-company-blogs
state_db: state/crawl.sqlite
request_interval_seconds: 0.3
user_agent: ai-company-blog-digest/0.1
max_attempts: 3
# 并行：发现 / 爬取落盘（IO）/ 翻译与 LLM（对齐本地 4090）
# 爬取与翻译流水线重叠：article 只管抓取写 Obsidian，llm 线程读文件翻译
source_concurrency: 3
article_concurrency: 3
llm_concurrency: 3

sources:
  - id: decagon
    name: Decagon
    enabled: true
    index_url: https://decagon.ai/resources/blog
    sitemap_url: https://decagon.ai/sitemap.xml
    include: '^https://decagon.ai/blog/[^/]+$'

  - id: sierra
    name: Sierra
    enabled: true
    index_url: https://sierra.ai/blog
    sitemap_url: https://sierra.ai/sitemap-en-us.xml
    include: '^https://sierra.ai/blog/[^/]+$'

  - id: cresta
    name: Cresta
    enabled: true
    index_url: https://cresta.com/blog
    sitemap_url: https://cresta.com/sitemap.xml
